<script>
const SUPABASE_URL='https://nompblznhrnedcseybkn.supabase.co';
const SUPABASE_KEY='sb_publishable_9d1kCj6KhuLQHe4AhIsEOw_72fnlScq';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);

const drop=$('#drop');
const picker=$('#pick');
const input=$('#files');
const fileList=$('#fileList');
const controls=$('#controls');
const actions=$('#actions');
const status=$('#status');
const bar=$('#bar');
const fill=$('#barFill');
const result=$('#result');

let selected=[];

const MAX_FILE=100*1024*1024;
const MAX_TOTAL=300*1024*1024;

/* =========================================================
   LOCAL UPLOAD HISTORY
========================================================= */

const LOCAL_HISTORY_KEY='vexo_share_upload_history';

function getUploadHistory(){
  try{
    const raw=localStorage.getItem(LOCAL_HISTORY_KEY);
    if(!raw)return [];
    
    const history=JSON.parse(raw);
    return Array.isArray(history)?history:[];
  }catch(err){
    console.error('Failed to load upload history:',err);
    return [];
  }
}

function saveUploadHistory(history){
  try{
    localStorage.setItem(
      LOCAL_HISTORY_KEY,
      JSON.stringify(history)
    );
  }catch(err){
    console.error('Failed to save upload history:',err);
  }
}

function saveShareToHistory(shareData){
  const history=getUploadHistory();

  history.unshift(shareData);

  saveUploadHistory(history);

  renderUploadHistory();
}

function deleteHistoryItem(id){
  const history=getUploadHistory();

  const updated=history.filter(
    item=>String(item.id)!==String(id)
  );

  saveUploadHistory(updated);

  renderUploadHistory();
}

function formatHistoryDate(date){
  const d=new Date(date);

  if(Number.isNaN(d.getTime())){
    return 'Unknown date';
  }

  return d.toLocaleString();
}

function renderUploadHistory(){

  const history=getUploadHistory();
  const list=$('#historyList');

  if(!list)return;

  if(!history.length){

    list.innerHTML=`
      <div class="history-empty">
        <strong>No uploads yet</strong>
        Shares you create on this browser will appear here.
      </div>
    `;

    return;
  }

  list.innerHTML=history.map(item=>{

    const expiresTime=new Date(item.expires_at).getTime();
    const expired=
      Number.isFinite(expiresTime)&&
      expiresTime<=Date.now();

    const files=
      Array.isArray(item.files)
      ?item.files
      :[];

    const totalSize=
      files.reduce(
        (total,file)=>total+Number(file.size||0),
        0
      );

    const fileCount=files.length;

    const name=
      fileCount===1
      ?files[0].name
      :`${fileCount} files`;

    const downloadLimit=
      item.max_downloads==null
      ?'Unlimited downloads'
      :`${item.max_downloads} download${item.max_downloads===1?'':'s'} max`;

    return `
      <div class="history-item ${expired?'history-expired':''}">

        <div class="history-main">

          <div class="history-icon">FILE</div>

          <div class="history-info">

            <div class="history-name">
              ${esc(name)}
            </div>

            <div class="history-meta">
              ${fileCount} file${fileCount===1?'':'s'}
              · ${fmt(totalSize)}
              · ${esc(downloadLimit)}
            </div>

            <div class="history-meta">
              ${expired?'Expired':'Expires'}
              ${esc(formatHistoryDate(item.expires_at))}
            </div>

          </div>

        </div>

        <div class="history-actions">

          <button
            class="btn primary"
            data-open="${esc(item.link||'')}">
            Open share
          </button>

          <button
            class="btn"
            data-copy="${esc(item.link||'')}">
            Copy link
          </button>

          <button
            class="btn"
            data-delete="${esc(item.id)}">
            Delete
          </button>

        </div>

      </div>
    `;

  }).join('');
}

/* =========================================================
   NORMAL APP FUNCTIONS
========================================================= */

function esc(v){
  return String(v).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function fmt(n){

  n=Number(n)||0;

  if(n<1024)return n+' B';

  const u=['KB','MB','GB'];
  let i=-1;

  do{
    n/=1024;
    i++;
  }while(n>=1024&&i<u.length-1);

  return n.toFixed(n>=100?0:1)+' '+u[i];
}

function randomCode(){

  const a=new Uint8Array(12);

  crypto.getRandomValues(a);

  return [...a]
    .map(x=>x.toString(36).padStart(2,'0'))
    .join('')
    .slice(0,16);
}

function randomId(){

  return crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now()+'-'+Math.random().toString(16).slice(2);
}

function pathSafeName(name){

  return name
    .replace(/[^a-zA-Z0-9._ -]/g,'_')
    .slice(0,180)||'file';
}

function setStatus(t,kind=''){
  status.className='status '+kind;
  status.textContent=t;
}

function render(){

  fileList.innerHTML=selected.map((f,i)=>`

    <div class="file">

      <div class="file-icon">
        ${esc(
          (f.name.split('.').pop()||'FILE')
          .slice(0,4)
          .toUpperCase()
        )}
      </div>

      <div class="file-main">

        <div class="file-name">
          ${esc(f.name)}
        </div>

        <div class="file-meta">
          ${fmt(f.size)}
          ${f.type?' · '+esc(f.type):''}
        </div>

      </div>

      <button
        class="remove"
        title="Remove"
        data-remove="${i}">
        ×
      </button>

    </div>

  `).join('');

  const has=selected.length>0;

  controls.classList.toggle(
    'hidden',
    !has
  );

  actions.classList.toggle(
    'hidden',
    !has
  );
}

function addFiles(list){

  const incoming=[...list];

  let total=
    selected.reduce((a,b)=>a+b.size,0);

  for(const f of incoming){

    if(f.size>MAX_FILE){

      setStatus(
        `${f.name} is over the 100 MB per-file limit.`,
        'error'
      );

      continue;
    }

    if(total+f.size>MAX_TOTAL){

      setStatus(
        'The combined upload is over the 300 MB limit.',
        'error'
      );

      break;
    }

    if(!selected.some(
      x=>
        x.name===f.name&&
        x.size===f.size&&
        x.lastModified===f.lastModified
    )){

      selected.push(f);
      total+=f.size;
    }

  }

  render();

  if(selected.length&&!status.textContent){

    setStatus(
      `${selected.length} file${selected.length===1?'':'s'} ready.`
    );
  }
}

/* =========================================================
   FILE PICKER / DRAG & DROP
========================================================= */

picker.onclick=()=>input.click();

input.onchange=e=>{
  addFiles(e.target.files);
};

fileList.onclick=e=>{

  const b=e.target.closest('[data-remove]');

  if(!b)return;

  selected.splice(
    Number(b.dataset.remove),
    1
  );

  render();

  setStatus(
    selected.length?'':''
  );
};

['dragenter','dragover'].forEach(ev=>
  drop.addEventListener(ev,e=>{

    e.preventDefault();

    drop.classList.add('drag');

  })
);

['dragleave','drop'].forEach(ev=>
  drop.addEventListener(ev,e=>{

    e.preventDefault();

    drop.classList.remove('drag');

  })
);

drop.addEventListener('drop',e=>{
  addFiles(e.dataTransfer.files);
});

document.addEventListener('mousemove',e=>{

  document.body.style.setProperty(
    '--mx',
    e.clientX+'px'
  );

  document.body.style.setProperty(
    '--my',
    e.clientY+'px'
  );

});

/* =========================================================
   BUTTONS
========================================================= */

$('#clear').onclick=()=>{

  selected=[];
  input.value='';

  render();

  setStatus('');
};

$('#newShare').onclick=()=>{

  result.classList.add('hidden');

  $('#clear').click();
};

$('#copy').onclick=async()=>{

  try{

    await navigator.clipboard.writeText(
      $('#shareLink').value
    );

    $('#copy').textContent='Copied';

    setTimeout(
      ()=>$('#copy').textContent='Copy link',
      1000
    );

  }catch(err){

    console.error(err);
    setStatus(
      'Could not copy the link.',
      'error'
    );

  }

};

$('#themeBtn').onclick=()=>{

  document.body.classList.toggle('light');

};

/* =========================================================
   CREATE SHARE
========================================================= */

$('#create').onclick=async()=>{

  if(!selected.length)return;

  $('#create').disabled=true;
  $('#clear').disabled=true;

  bar.classList.remove('hidden');

  fill.style.width='0%';

  setStatus('Creating share…');

  const code=randomCode();

  const hours=
    Number($('#expiry').value);

  const expires=
    new Date(
      Date.now()+hours*3600000
    ).toISOString();

  const maxVal=$('#limit').value;

  const max_downloads=
    maxVal
    ?Number(maxVal)
    :null;

  try{

    const {
      data:share,
      error:shareError
    }=await db
      .from('shares')
      .insert({
        share_code:code,
        expires_at:expires,
        max_downloads,
        download_count:0
      })
      .select(
        'id,share_code,expires_at,max_downloads'
      )
      .single();

    if(shareError)
      throw shareError;

    const localFiles=[];

    for(
      let i=0;
      i<selected.length;
      i++
    ){

      const f=selected[i];

      const storagePath=
        `${code}/${randomId()}-${pathSafeName(f.name)}`;

      setStatus(
        `Uploading ${i+1} of ${selected.length}: ${f.name}`
      );

      fill.style.width=
        Math.round(
          (i/selected.length)*90
        )+'%';

      const {
        error:uploadError
      }=await db
        .storage
        .from('vexo-files')
        .upload(
          storagePath,
          f,
          {
            cacheControl:'3600',
            upsert:false,
            contentType:
              f.type||
              'application/octet-stream'
          }
        );

      if(uploadError)
        throw uploadError;

      const {
        error:fileError
      }=await db
        .from('share_files')
        .insert({
          share_id:share.id,
          file_name:f.name,
          storage_path:storagePath,
          file_size:f.size,
          mime_type:
            f.type||
            'application/octet-stream'
        });

      if(fileError)
        throw fileError;

      localFiles.push({
        name:f.name,
        size:f.size,
        type:
          f.type||
          'application/octet-stream'
      });

      fill.style.width=
        Math.round(
          ((i+1)/selected.length)*90
        )+'%';
    }

    fill.style.width='100%';

    const url=
      new URL(
        'share.html',
        location.href
      );

    url.searchParams.set(
      'code',
      share.share_code
    );

    const shareLink=url.href;

    $('#shareLink').value=shareLink;

    saveShareToHistory({

      id:randomId(),

      share_code:
        share.share_code,

      link:
        shareLink,

      expires_at:
        share.expires_at,

      max_downloads:
        share.max_downloads,

      files:
        localFiles,

      created_at:
        new Date().toISOString()

    });

    result.classList.remove(
      'hidden'
    );

    setStatus(
      'Share is ready.',
      'success'
    );

  }catch(err){

    console.error(err);

    setStatus(
      err?.message||
      'Something went wrong.',
      'error'
    );

  }finally{

    $('#create').disabled=false;
    $('#clear').disabled=false;

  }

};

/* =========================================================
   TABS
========================================================= */

$('#createTab').onclick=()=>{

  $('#createTab')
    .classList.add('active');

  $('#uploadsTab')
    .classList.remove('active');

  $('#createPanel')
    .classList.remove('hidden');

  $('#uploadsPanel')
    .classList.add('hidden');

};

$('#uploadsTab').onclick=()=>{

  $('#uploadsTab')
    .classList.add('active');

  $('#createTab')
    .classList.remove('active');

  $('#uploadsPanel')
    .classList.remove('hidden');

  $('#createPanel')
    .classList.add('hidden');

  renderUploadHistory();

};

/* =========================================================
   MY UPLOADS BUTTONS
========================================================= */

$('#historyList').addEventListener(
  'click',
  async e=>{

    const open=
      e.target.closest('[data-open]');

    if(open){

      const link=open.dataset.open;

      if(link){
        window.location.href=link;
      }

      return;
    }

    const copy=
      e.target.closest('[data-copy]');

    if(copy){

      try{

        const link=copy.dataset.copy;

        if(!link){
          throw new Error('No link available');
        }

        await navigator.clipboard.writeText(link);

        const oldText=
          copy.textContent;

        copy.textContent='Copied';

        setTimeout(
          ()=>copy.textContent=oldText,
          1000
        );

      }catch(err){

        console.error(err);

      }

      return;
    }

    const del=
      e.target.closest('[data-delete]');

    if(del){

      deleteHistoryItem(
        del.dataset.delete
      );

    }

  }
);

$('#clearHistory').onclick=()=>{

  const history=
    getUploadHistory();

  if(!history.length)
    return;

  if(confirm(
    'Clear all upload history from this browser? This will not delete the actual files.'
  )){

    localStorage.removeItem(
      LOCAL_HISTORY_KEY
    );

    renderUploadHistory();

  }

};

/* =========================================================
   INITIALIZE
========================================================= */

renderUploadHistory();
</script>
